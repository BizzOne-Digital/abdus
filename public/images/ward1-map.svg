<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" fill="none" role="img" aria-labelledby="wardTitle">
  <title id="wardTitle">North Oshawa Ward 1 map</title>
  <defs>
    <linearGradient id="wardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#176BDB"/>
      <stop offset="100%" stop-color="#2B2B8F"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="420" rx="20" fill="#071B3B" fill-opacity="0.35"/>
  <!-- surrounding wards (muted) -->
  <path d="M40 80 L180 55 L260 90 L240 200 L90 220 Z" fill="#0D2A55" stroke="#1E4A8C" stroke-width="1.5" opacity="0.55"/>
  <path d="M260 90 L400 70 L440 160 L360 250 L240 200 Z" fill="#0D2A55" stroke="#1E4A8C" stroke-width="1.5" opacity="0.45"/>
  <path d="M90 220 L240 200 L280 320 L120 350 Z" fill="#0D2A55" stroke="#1E4A8C" stroke-width="1.5" opacity="0.4"/>
  <!-- Ward 1 highlight -->
  <path d="M150 40 L290 30 L340 110 L300 210 L170 230 L110 150 Z" fill="url(#wardFill)" stroke="#8DDCFF" stroke-width="2.5" filter="url(#softGlow)" opacity="0.95"/>
  <circle cx="220" cy="120" r="6" fill="#FFFFFF"/>
  <text x="232" y="125" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">NORTH OSHAWA</text>
  <text x="232" y="143" fill="#8DDCFF" font-family="Arial, sans-serif" font-size="12" font-weight="600">WARD 1</text>
  <!-- roads -->
  <path d="M130 160 L320 140" stroke="#49C7E8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <path d="M180 60 L210 220" stroke="#49C7E8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
</svg>
